site_name: gpuprov
site_description: >-
  Provision GPU VMs across AWS, GCP and Prime Intellect with failover,
  durable state machines, SSH, and single-node k3s clusters.
site_url: https://dumbai.github.io/gpu-provisioner/
repo_url: https://github.com/DumbAI/gpu-provisioner
repo_name: DumbAI/gpu-provisioner
edit_uri: edit/main/docs/
copyright: Apache-2.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - CLI reference: guides/cli.md
      - Configuration: guides/configuration.md
      - Kubernetes (k3s): guides/kubernetes.md
  - Clouds:
      - Overview: clouds/index.md
      - AWS: clouds/aws.md
      - GCP: clouds/gcp.md
      - Prime Intellect: clouds/primeintellect.md
      - Docker (local test cloud): clouds/docker.md
  - Architecture:
      - State machines: architecture/state-machines.md
      - Adding a cloud: architecture/adding-a-cloud.md
  - Development:
      - Testing: development/testing.md
      - Releasing: development/releasing.md
