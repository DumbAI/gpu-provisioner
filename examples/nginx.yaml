# A minimal container app for a gpuprov k3s cluster.
#
#   export KUBECONFIG=~/.gpu-provisioner/kube/<name>.yaml
#   kubectl apply -f examples/nginx.yaml
#   curl http://<public-ip>/          # served via the k3s-bundled Traefik ingress
#
# Self-healing demo (k3s is the reconciler):
#   kubectl delete pod -l app=nginx   # deleted replicas are recreated to match `replicas`
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
