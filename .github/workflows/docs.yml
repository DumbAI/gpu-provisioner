name: Docs

# Build the MkDocs site on every PR that touches it, and publish it to
# GitHub Pages (gh-pages branch → https://dumbai.github.io/gpu-provisioner/)
# on pushes to main.
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to the gh-pages branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gh-deploy commits on top of the existing gh-pages history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Build (strict)
        run: mkdocs build --strict
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --strict --force --message "Deploy docs site {sha} with MkDocs {version}"
